[project]
name = "repo-queue"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["celery[redis]>=5.6,<6"]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_queue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
