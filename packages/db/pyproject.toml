[project]
name = "repo-db"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["alembic>=1.16,<2", "sqlalchemy>=2.0,<3", "sqlmodel>=0.0.31,<0.1"]

[dependency-groups]
dev = ["pytest>=8.4,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
