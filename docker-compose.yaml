name: tyche

services:
  postgres:
    image: postgres:16-alpine
    container_name: tyche-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tyche
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tyche"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tyche-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    image: tyche-python
    container_name: tyche-api
    restart: unless-stopped
    environment:
      NODE_ENV: "production"
      CLIENT_ORIGINS: "${CLIENT_ORIGINS:-http://localhost:3000}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      DATABASE_URL: "${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/tyche}"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    command: sh -c "cd packages/db && alembic upgrade head && cd /app && uvicorn api.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: .
    image: tyche-python
    container_name: tyche-worker
    restart: unless-stopped
    environment:
      REDIS_URL: "${DOCKER_REDIS_URL:-redis://redis:6379/0}"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A worker.app:celery_app worker --loglevel=INFO

volumes:
  postgres_data:
  redis_data:
