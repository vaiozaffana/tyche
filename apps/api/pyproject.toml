[project]
name = "monorepo-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "email-validator>=2.3,<3",
  "fastapi>=0.121,<0.122",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.10,<3",
  "repo-db",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.18,<2", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.uv.sources]
repo-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
