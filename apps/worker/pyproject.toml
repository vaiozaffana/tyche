[project]
name = "tyche-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic-settings>=2.10,<3", "repo-queue"]

[dependency-groups]
dev = ["mypy>=1.18,<2", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.uv.sources]
repo-queue = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
