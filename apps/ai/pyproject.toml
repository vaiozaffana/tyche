[project]
name = "tyche-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "firecrawl-py>=4,<5",
  "google-genai>=3,<4",
  "httpx>=0.28,<1",
  "langchain-core>=1,<2",
  "langgraph>=1,<2",
  "pydantic-settings>=2.10,<3",
  "repo-db",
]

[dependency-groups]
dev = ["mypy>=1.18,<2", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.uv.sources]
repo-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tyche_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
